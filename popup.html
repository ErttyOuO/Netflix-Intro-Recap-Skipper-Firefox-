<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Netflix Skipper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <img src="images/icon-48.png" alt="Netflix Skipper" class="logo">
      <div>
        <h1 data-i18n="popup_title">Netflix Skipper</h1>
        <p class="version" id="versionText"></p>
      </div>
    </header>

    <section class="status-card" aria-live="polite">
      <div class="status-line">
        <span class="status-dot" id="statusDot" aria-hidden="true"></span>
        <span id="statusText" data-i18n="status_checking">正在確認目前頁面…</span>
      </div>
      <p class="session-count" id="sessionCount"></p>
    </section>

    <section class="settings">
      <div class="setting-item">
        <div class="setting-info">
          <span class="setting-icon" aria-hidden="true">🍿</span>
          <span class="setting-label" data-i18n="setting_skip_intro">自動跳過片頭</span>
        </div>
        <label class="toggle">
          <input type="checkbox" id="skipIntro" checked data-i18n-aria-label="setting_skip_intro">
          <span class="slider"></span>
        </label>
      </div>

      <div class="setting-item">
        <div class="setting-info">
          <span class="setting-icon" aria-hidden="true">🕵️</span>
          <span class="setting-label" data-i18n="setting_skip_recap">自動跳過前情提要</span>
        </div>
        <label class="toggle">
          <input type="checkbox" id="skipRecap" checked data-i18n-aria-label="setting_skip_recap">
          <span class="slider"></span>
        </label>
      </div>

      <div class="setting-item">
        <div class="setting-info">
          <span class="setting-icon" aria-hidden="true">📺</span>
          <span class="setting-label" data-i18n="setting_next_episode">自動播放下一集</span>
        </div>
        <label class="toggle">
          <input type="checkbox" id="skipNextEpisode" checked data-i18n-aria-label="setting_next_episode">
          <span class="slider"></span>
        </label>
      </div>

      <div class="setting-item">
        <div class="setting-info">
          <span class="setting-icon" aria-hidden="true">▶️</span>
          <div class="setting-copy">
            <span class="setting-label" data-i18n="setting_still_watching">自動繼續播放</span>
            <span class="setting-note" data-i18n="setting_still_watching_note">處理「仍在觀看嗎」提示，預設關閉</span>
          </div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="dismissStillWatching" data-i18n-aria-label="setting_still_watching">
          <span class="slider"></span>
        </label>
      </div>

      <div class="setting-item">
        <div class="setting-info">
          <span class="setting-icon" aria-hidden="true">🔔</span>
          <span class="setting-label" data-i18n="setting_toast">顯示跳過提示</span>
        </div>
        <label class="toggle">
          <input type="checkbox" id="showToast" checked data-i18n-aria-label="setting_toast">
          <span class="slider"></span>
        </label>
      </div>
    </section>

    <footer class="footer">
      <p class="credit">
        <span data-i18n="credit_original">原作者</span>：<a href="https://github.com/JohnnyTseng" target="_blank" rel="noreferrer">JohnnyTseng</a><br>
        <span data-i18n="credit_firefox">Firefox 版本</span>：<a href="https://github.com/ErttyOuO/Netflix-Intro-Recap-Skipper-Firefox-" target="_blank" rel="noreferrer">ErttyOuO</a>
      </p>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
