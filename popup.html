<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <img src="images/icon-48.png" alt="Netflix Skipper" class="logo">
      <h1>Netflix Skipper</h1>
    </header>
    
    <section class="settings">
      <div class="setting-item">
        <div class="setting-info">
          <span class="setting-icon">🍿</span>
          <span class="setting-label">自動跳過片頭</span>
        </div>
        <label class="toggle">
          <input type="checkbox" id="skipIntro" checked>
          <span class="slider"></span>
        </label>
      </div>
      
      <div class="setting-item">
        <div class="setting-info">
          <span class="setting-icon">🕵️</span>
          <span class="setting-label">自動跳過前情提要</span>
        </div>
        <label class="toggle">
          <input type="checkbox" id="skipRecap" checked>
          <span class="slider"></span>
        </label>
      </div>
      
      <div class="setting-item">
        <div class="setting-info">
          <span class="setting-icon">📺</span>
          <span class="setting-label">自動播放下一集</span>
        </div>
        <label class="toggle">
          <input type="checkbox" id="skipNextEpisode" checked>
          <span class="slider"></span>
        </label>
      </div>
    </section>
    
    <footer class="footer">
      <p class="credit">
        原作者：<a href="https://github.com/JohnnyTseng" target="_blank">JohnnyTseng</a><br>
        Firefox 版本：<a href="https://github.com/ErttyOuO/Netflix-Intro-Recap-Skipper-Firefox-" target="_blank">ErttyOuO</a>
      </p>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
